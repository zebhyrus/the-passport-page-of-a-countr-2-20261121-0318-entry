  <!-- TIDE PERMIT : the telling paperwork detail -->
  <rect x="540" y="668" width="416" height="302" fill="#fff8e0" stroke="#8a7a4d" stroke-width="2"/>
  <text x="748" y="696" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" letter-spacing="2" fill="#1d4a55">TIDE PERMIT &#8212; CAUSEWAY</text>
  <line x1="560" y1="708" x2="936" y2="708" stroke="#8a7a4d" stroke-width="1"/>
  <text x="560" y="732" font-family="Arial, sans-serif" font-size="12.5" fill="#222">Holder may cross the Aldhaven Causeway only</text>
  <text x="560" y="752" font-family="Arial, sans-serif" font-size="12.5" fill="#222">at low tide, within two hours either side of</text>
  <text x="560" y="772" font-family="Arial, sans-serif" font-size="12.5" fill="#222">low water. Crossings are entered by hand</text>
  <text x="560" y="792" font-family="Arial, sans-serif" font-size="12.5" fill="#222">in the Tide Office log; a missed tide means</text>
  <text x="560" y="812" font-family="Arial, sans-serif" font-size="12.5" fill="#222">waiting on the far shore until the next one.</text>
  <text x="560" y="838" font-family="Arial, sans-serif" font-size="11" font-style="italic" fill="#555">Velloria is reached by the tide, not by the clock.</text>
